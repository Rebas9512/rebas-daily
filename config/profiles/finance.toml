# 商业板块兴趣画像（初稿 2026-07-03，2026-07-04 板块拆分时启用）
# 时效：最新（无沉淀期）。源全 headline 级，入选后 lazy fetch 补全文。

[board]
id = "finance"
name = "商业 · 美股/宏观"

# 侧重：美股为主（用户 2026-07-03 确认）。
# 现有 8 个英文源即可覆盖，中文源（RSSHub 依赖）降为可选项。

[[interest]]
name = "美股市场动态"
weight = 5
keywords = [
  "stocks", "S&P 500", "Nasdaq", "Dow", "earnings", "IPO",
  "Fed", "interest rate", "inflation", "treasury",
]

[[interest]]
name = "科技公司财经"
weight = 4
keywords = [
  "tech stocks", "semiconductor", "AI chip", "Nvidia",
  "acquisition", "merger", "antitrust", "valuation",
]

[[interest]]
name = "经济学与商业大奖"
weight = 3                  # 2026-08-27 奖项信号层：gnews-clark-medal/loeb-awards
                            # 接入——克拉克奖(4月)/Loeb 获奖名单(10月)/经济学诺奖
                            # (10月，走媒体源)是硬新闻；得主生日/讲座类散提不在此列
keywords = ["Nobel", "Clark Medal", "Loeb Awards", "laureate", "economist"]

[[interest]]
name = "预测市场热门盘口"
weight = 4                  # 2026-09-02 盘口线改法：polymarket-hot 全站流不限领域——大选/
                            # 地缘/宏观/科技与 AI 的重大押注盘只要有新闻价值都算（赔率=真金
                            # 押注的群体预测）；体育赛果/币价/刷量盘已在采集层黑名单，漏网的
                            # 请压低分。盘口剧烈异动（pm_move_pp）优先于绝对热度
keywords = ["Polymarket", "Kalshi", "odds", "election", "geopolitics", "Fed"]

[low_priority]
keywords = []

[blocklist]
keywords = []

[reader]
# 切入角度=背景故事+术语并重
assumed = "懂技术、日常看美股新闻，但不是金融从业者"
explain = "切入角度是背景故事与术语并重：人物与机构的来历战绩（做空者此前的战役、基金的江湖地位、公司的起家史）、市场事件的前情脉络（此前几个季度发生了什么）；金融术语（私募信贷、0DTE、超额配售这类）首次出现给一句白话"
